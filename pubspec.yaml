name: arvin
description: آروین - مدیریت کارها، یادداشت‌ها و پیگیری‌ها
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  shamsi_date: ^1.1.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
