name: Build Arvin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project shell
        run: flutter create --org com.arvin --project-name arvin /tmp/arvin

      - name: Configure Android notifications and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('/tmp/arvin/android/app/build.gradle.kts')
          text = gradle.read_text()
          text = re.sub(r'\n\s*isCoreLibraryDesugaringEnabled\s*=\s*true', '', text)
          text = re.sub(r'\n\s*coreLibraryDesugaring\([^\n]+\)', '', text)
          text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in text:
              text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
          gradle.write_text(text)

          manifest = Path('/tmp/arvin/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace('<application ', '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application ', 1)
          if 'ScheduledNotificationReceiver' not in text:
              receivers = '''\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n'''
              text = text.replace('    </application>', receivers + '    </application>', 1)
          manifest.write_text(text)
          PY

      - name: Copy Arvin source and fonts
        run: |
          cp pubspec.yaml /tmp/arvin/pubspec.yaml
          cp lib/main.dart /tmp/arvin/lib/main.dart
          mkdir -p /tmp/arvin/assets/fonts
          curl -L --fail -o /tmp/arvin/assets/fonts/Vazirmatn-Regular.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L --fail -o /tmp/arvin/assets/fonts/Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf

      - name: Build release APK
        working-directory: /tmp/arvin
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-apk
          path: /tmp/arvin/build/app/outputs/flutter-apk/app-release.apk
