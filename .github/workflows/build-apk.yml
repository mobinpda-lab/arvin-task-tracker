name: Build Arvin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project shell
        run: flutter create --org com.arvin --project-name arvin /tmp/arvin

      - name: Copy Arvin source
        run: |
          cp pubspec.yaml /tmp/arvin/pubspec.yaml
          cp lib/main.dart /tmp/arvin/lib/main.dart
          mkdir -p /tmp/arvin/assets/fonts
          curl -L --fail -o /tmp/arvin/assets/fonts/Vazirmatn-Regular.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L --fail -o /tmp/arvin/assets/fonts/Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf

      - name: Build release APK
        working-directory: /tmp/arvin
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-apk
          path: /tmp/arvin/build/app/outputs/flutter-apk/app-release.apk
